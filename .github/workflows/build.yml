name: Build KATA LONI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o kataloni_project.zip

      - name: Add AndroidX properties
        run: |
          echo "android.useAndroidX=true" >> kataloni/gradle.properties
          echo "android.nonTransitiveRClass=true" >> kataloni/gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find sdkmanager and set PATH
        run: |
          SDKMANAGER_PATH=$(find $ANDROID_HOME -name "sdkmanager" -type f | head -n 1)
          echo "$(dirname $SDKMANAGER_PATH)" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: kataloni
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kataloni-apk
          path: kataloni/app/build/outputs/apk/debug/app-debug.apk
            - name: Add AndroidX properties
        run: |
          echo "android.useAndroidX=true" >> kataloni/gradle.properties
          echo "android.nonTransitiveRClass=true" >> kataloni/gradle.properties

      - name: Fix missing app namespace in layout
        run: |
          sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android">|xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:app="http://schemas.android.com/apk/res-auto">|' kataloni/app/src/main/res/layout/activity_main.xml
